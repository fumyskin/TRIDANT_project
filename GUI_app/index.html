<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ESP32 Telemetry Dashboard</title>
    <style>
        body { font-family: sans-serif; background: #121212; color: #e0e0e0; padding: 20px; margin: 0; }
        
        .dashboard_container { 
            max-width: 1000px; 
            margin: 0 auto; 
            display: flex; 
            flex-direction: column; 
            gap: 15px; 
        }
        
        .main_box { background: #1e1e1e; padding: 15px 20px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.3); }
        .headers { font-size: 1.3rem; font-weight: bold; border-bottom: 1px solid #333; padding-bottom: 8px; margin-bottom: 12px; text-align: center; color: #00ffcc; }
        .readings-grid { display: flex; justify-content: space-around; flex-wrap: wrap; gap: 12px; margin-bottom: 10px; }
        .imu-axis { font-family: monospace; font-size: 1.1rem; background: #2a2a2a; padding: 8px 15px; border-radius: 6px; min-width: 130px; text-align: center; }
        .value { color: #00ffcc; font-weight: bold; display: block; font-size: 1.4rem; margin-top: 3px; }
        
        /* 💡 Grid dynamically adjusts to fit 3 compact graphs side-by-side or wrapped */
        .charts_wrapper {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 15px;
        }

        .graph_box { 
            background: #1e1e1e; 
            padding: 15px; 
            border-radius: 8px; 
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            max-width: 100%;
            height: 200px; /* Kept slightly shorter to look great side-by-side */
            position: relative; 
        }
        
        .graph-title { font-size: 0.95rem; font-weight: bold; margin-bottom: 8px; color: #aaa; text-align: center; }
        #status { font-size: 0.85rem; color: #888; text-align: center; margin: 0; }
        .raw-debug { font-size: 0.8rem; color:#666; text-align: center; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; margin: 4px 0 0 0; }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <div class="dashboard_container">
        <div class="main_box">
            <div class="headers">ESP32 C6 - IMU Telemetry Dashboard</div>
            <div class="readings-grid">
                <div class="imu-axis">Roll <span id="roll_val" class="value">0.00</span>°</div>
                <div class="imu-axis">Pitch <span id="pitch_val" class="value">0.00</span>°</div>
                <div class="imu-axis">Yaw <span id="yaw_val" class="value">0.00</span>°</div>
            </div>
            <p id="status">WebSocket Status: <span id="ws_status" style="color: orange;">Connecting...</span></p>
            <p class="raw-debug">Raw JSON: <span id="esp_reading_value">-</span></p>
        </div>

        <div class="charts_wrapper">
            <div class="graph_box">
                <div class="graph-title">Roll Axis History</div>
                <canvas id="rollChart"></canvas>
            </div>

            <div class="graph_box">
                <div class="graph-title">Pitch Axis History</div>
                <canvas id="pitchChart"></canvas>
            </div>

            <div class="graph_box">
                <div class="graph-title">Yaw Axis History</div>
                <canvas id="yawChart"></canvas>
            </div>
        </div>
    </div>
    
    <script src="./js/app.js"></script>
</body>
</html>
