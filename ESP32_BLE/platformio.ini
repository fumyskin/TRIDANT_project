[env:codecell_c6]
; THE FIX: Point to the community fork that supports Arduino Core 3.0 for the C6
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = esp32-c6-devkitc-1
framework = arduino

; 1. Match the CodeCell's 8MB Flash Memory
board_upload.flash_size = 8MB
board_build.partitions = default_8MB.csv 

; 2. CRITICAL: Route the Serial monitor to the CodeCell's USB-C port
build_flags = 
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1

; 3. Automatically download dependencies
lib_deps = 
    microbotsio/CodeCell
    h2zero/NimBLE-Arduino @ ^1.4.1